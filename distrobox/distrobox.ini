[coding]
additional_packages="btop git gh build-essential neovim tmux"
home=~/distrobox/coding
image=debian:stable-slim
start_now=true
unshare_devsys=true
unshare_groups=true
unshare_netns=true
unshare_process=true
init_hooks="cd $HOME && [ ! -f ./linux-scripts/distrobox/post_install.sh ] || FLAVOR=coding ./linux-scripts/distrobox/post_install.sh"
exported_apps="code brave-origin"


[browser]
additional_packages="btop"
home=~/distrobox/browser
image=debian:stable-slim
start_now=true
unshare_devsys=true
unshare_groups=true
unshare_netns=true
unshare_process=true
init_hooks="cd $HOME && [ ! -f ./linux-scripts/distrobox/post_install.sh ] || FLAVOR=browser ./linux-scripts/distrobox/post_install.sh"
exported_apps="brave-origin mullvad-browser"


[lazyvim]
additional_packages="neovim git lazygit tree-sitter-cli gcc clang curl fzf ripgrep fd xsel tmux"
home=~/distrobox/lazyvim
image=alpine:latest
start_now=true
unshare_devsys=true
unshare_groups=true
unshare_netns=true
unshare_process=true
init_hooks="cd $HOME && [ ! -f ./linux-scripts/distrobox/post_install.sh ] || FLAVOR=lazyvim ./linux-scripts/distrobox/post_install.sh"
